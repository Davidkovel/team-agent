<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agente AMG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070d19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AMG">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=hub25">
  <link rel="stylesheet" href="hub/design.css?v=hub25">
  <link rel="stylesheet" href="hub/amg.css?v=hub25">
  <link rel="stylesheet" href="hub/home.css?v=hub25">
</head>
<body>
  <section id="login" hidden>
    <div class="login-wrap">
      <div class="login-hero">
        <img class="logo xl" src="logo.png" alt="">
        <img class="wordmark xl" src="assets/amg-wordmark.png" alt="Agente AMG">
        <p>Tudo sob controlo. Cada commit, cada ficheiro, cada pessoa. Sempre à vista.</p>
      </div>
      <form id="login-form" class="login-card">
        <h2>Entrar</h2>
        <label>Utilizador<input id="username" placeholder="ex: owner" autocomplete="username" required></label>
        <label>Palavra-passe<input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required></label>
        <button class="primary">Entrar</button>
        <p id="login-error" class="error"></p>
        <p class="hint">Cada pessoa tem o seu utilizador e a sua palavra-passe. Ainda não tens? Pede ao Owner para te criar um em <b>Equipa</b>.</p>
      </form>
    </div>
  </section>

  <div id="app" class="hub" hidden>
    <aside class="hside">
      <a class="side-brand" href="#/home" title="Centro de comando"><svg class="i side-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5l4.4 3.6L12 5.5l4.1 6.6 4.4-3.6-1.9 9.5H5.4z"/><path d="M5.4 20.5h13.2"/></svg><span class="side-word">Centro de<br>comando</span></a>
      <button class="side-search" id="open-palette" title="Procurar ou executar (Ctrl+K)"></button>
      <nav class="side-nav" id="tabs"></nav>
      <div class="hside-foot">
        <a class="side-me" href="#/definicoes"><span class="av" id="me-av"></span><div><b id="whoami"></b><span id="live" class="side-live">a ligar</span></div></a>
        <div class="side-tools">
          <button id="bell" class="tool" title="Notificações" aria-label="Notificações"><i id="bell-n" class="count" hidden></i></button>
          <button id="maximize" class="tool" title="Ecrã inteiro" aria-label="Ecrã inteiro"></button>
          <button id="collapse" class="tool" title="Recolher a barra" aria-label="Recolher a barra"></button>
        </div>
      </div>
    </aside>
    <main id="view"></main>
  </div>

  <div id="notif-panel" class="pop" hidden></div>
  <button id="ai-fab" title="Team AI" aria-label="Team AI" hidden></button>
  <div id="ai-panel" class="pop" hidden></div>
  <div id="palette" class="pal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <script src="hub/ui.js?v=hub25"></script>
  <script src="hub/home.js?v=hub25"></script>
  <script src="hub/pages.js?v=hub25"></script>
  <script src="hub/baredesk.js?v=hub25"></script>
  <script src="hub/shell.js?v=hub25"></script>
  <script src="app.js?v=hub25"></script>
</body>
</html>
