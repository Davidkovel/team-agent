<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agente AMG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" hidden>
    <div class="login-wrap">
      <div class="login-hero">
        <img class="logo xl" src="logo.svg" alt="">
        <img class="car" src="assets/amg-car.svg" alt="">
        <h1>AGENTE <span>AMG</span></h1>
        <p>A casa da equipa: empresas, skills, vídeos e tudo o que cada um está a fazer, num só sítio.</p>
      </div>
      <form id="login-form" class="login-card">
        <h2>Entrar</h2>
        <label>Utilizador<input id="username" placeholder="ex: owner" autocomplete="username" required></label>
        <label>Palavra-passe<input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required></label>
        <button class="primary">Entrar</button>
        <p id="login-error" class="error"></p>
        <p class="hint">Cada pessoa tem o seu utilizador e a sua palavra-passe. Ainda não tens? Pede ao Owner para te criar um em <b>Equipa</b>.</p>
      </form>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/home"><img class="logo" src="logo.svg" alt=""><span class="brand-text"><b>AGENTE AMG</b><small>a casa da equipa</small></span></a>
      <nav class="tabs" id="tabs"></nav>
      <div class="right">
        <span id="live" class="pill">a ligar</span>
        <span id="whoami" class="who"></span>
        <button id="maximize" class="icon-btn" title="Ecrã inteiro"></button>
        <button id="logout" class="ghost">Sair</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <script src="app.js"></script>
</body>
</html>
