services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: team
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: team
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://team:${POSTGRES_PASSWORD}@postgres:5432/team
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      MARK_PASSWORD: ${MARK_PASSWORD:?set MARK_PASSWORD in .env}
      DAVID_PASSWORD: ${DAVID_PASSWORD:?set DAVID_PASSWORD in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
