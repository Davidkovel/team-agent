<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" hidden>
    <form id="login-form" class="card">
      <h1>Team Dashboard</h1>
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button>Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <main id="app" hidden>
    <header>
      <h1>Team Dashboard</h1>
      <span id="live" class="pill">connecting</span>
      <span id="whoami"></span>
      <button id="agent-token">Agent token</button>
      <button id="logout">Sign out</button>
    </header>
    <p id="token-box" class="card" hidden></p>

    <h2>Team</h2>
    <div id="team" class="grid"></div>

    <h2>Approvals</h2>
    <div id="approvals"></div>

    <h2>Tasks</h2>
    <form id="task-form" class="card row">
      <input id="t-title" placeholder="Title" required>
      <input id="t-goal" placeholder="Goal">
      <input id="t-project" placeholder="Project folder (optional)">
      <select id="t-assignee"></select>
      <textarea id="t-description" placeholder="Description"></textarea>
      <textarea id="t-requirements" placeholder="Requirements, one per line"></textarea>
      <button>Create task</button>
    </form>
    <div class="table-wrap"><table id="tasks"></table></div>
    <div id="task-detail" class="card" hidden></div>

    <div class="cols">
      <div><h2>Activity</h2><ul id="activity" class="feed"></ul></div>
      <div><h2>Usage</h2><div class="table-wrap"><table id="usage"></table></div>
        <p class="hint">Tokens and cost are estimates reported by the Claude Agent SDK, not billing data.</p></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
