# The team's Hub in the cloud (Fly.io): always on, so nobody's PC has to be. One machine, SQLite + library on a volume.
# Secrets (fly secrets set): TEAM_KEY, JWT_SECRET, OWNER_PASSWORD, MARK_PASSWORD, DAVID_PASSWORD.
app = "agente-amg-hub"
primary_region = "mad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/hub.db"
  REDIS_URL = ""
  LIBRARY_DIR = "/data/library"
  # no sign-in by IP on the internet: the widget signs in with the team key, a browser with the password
  IP_USERS = ""
  TEAM_IP_USERS = ""

[mounts]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
