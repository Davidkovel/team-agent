<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" hidden>
    <form id="login-form" class="card">
      <div class="brand">◆ Team Workspace</div>
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button>Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <div id="app" hidden>
    <aside>
      <div class="brand">◆ Team Workspace</div>
      <nav id="nav"></nav>
      <div class="me">
        <div id="whoami"></div>
        <button id="agent-token" class="ghost">Agent token</button>
        <button id="logout" class="ghost">Sign out</button>
      </div>
    </aside>
    <main>
      <header>
        <h1 id="title"></h1>
        <span id="live" class="pill">connecting</span>
        <button id="to-widget" class="ghost" hidden>▣ Back to widget</button>
      </header>
      <p id="token-box" class="card" hidden></p>
      <section id="view"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
