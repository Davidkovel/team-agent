<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#b9bec6"/>
      <stop offset=".55" stop-color="#6d727b"/>
      <stop offset="1" stop-color="#d4d8de"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43474f"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2e34"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3a2a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff3a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- antenna with a red tip -->
  <path d="M50 17 V8" stroke="url(#chrome)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="50" cy="7" r="6" fill="url(#glow)"/>
  <circle cx="50" cy="7" r="2.8" fill="#ff3a2a"/>

  <!-- ear pods, chrome -->
  <rect x="11" y="28" width="9" height="20" rx="4" fill="url(#chrome)"/>
  <rect x="80" y="28" width="9" height="20" rx="4" fill="url(#chrome)"/>
  <rect x="13.5" y="33" width="4" height="10" rx="2" fill="#ff3a2a" opacity=".85"/>

  <!-- head: black shell in a chrome rim -->
  <rect x="16" y="15" width="68" height="46" rx="17" fill="url(#chrome)"/>
  <rect x="18" y="17" width="64" height="42" rx="15.5" fill="url(#shell)"/>
  <path d="M26 21 Q50 15 74 21" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>

  <!-- visor -->
  <rect x="24" y="25" width="52" height="27" rx="11" fill="url(#glass)" stroke="#2c2f35" stroke-width="1"/>
  <circle cx="39" cy="38" r="10" fill="url(#glow)"/>
  <circle cx="61" cy="38" r="10" fill="url(#glow)"/>
  <path d="M33 41 L39 34.5 L45 41" fill="none" stroke="#ff4433" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 41 L61 34.5 L67 41" fill="none" stroke="#ff4433" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 46.5 Q50 49.5 55 46.5" fill="none" stroke="#ff4433" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M28 28 L36 28" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" stroke-linecap="round"/>

  <!-- body with the AMG grille (vertical chrome bars) -->
  <rect x="27" y="60" width="46" height="26" rx="10" fill="url(#shell)" stroke="url(#chrome)" stroke-width="1.6"/>
  <g stroke="url(#chrome)" stroke-width="1.6" stroke-linecap="round">
    <path d="M38 64 V72"/><path d="M42.7 64 V72"/><path d="M47.4 64 V72"/><path d="M52.1 64 V72"/><path d="M56.8 64 V72"/><path d="M61.5 64 V72"/>
  </g>

  <!-- feet -->
  <rect x="31" y="85" width="14" height="8" rx="3.5" fill="url(#chrome)"/>
  <rect x="55" y="85" width="14" height="8" rx="3.5" fill="url(#chrome)"/>

  <!-- laptop with the AMG lid -->
  <path d="M33 66 L80 61 L83 85 L36 90 Z" fill="url(#lid)" stroke="url(#chrome)" stroke-width="1.4"/>
  <text x="58.5" y="79.5" text-anchor="middle" transform="rotate(-6 58.5 77)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="11.5" letter-spacing=".6" fill="url(#chrome)">AMG</text>
  <path d="M42 84 L78 80.2" stroke="#ff3a2a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M26 90 L84 84 L86 88 L28 94.5 Z" fill="url(#chrome)"/>

  <!-- hands -->
  <circle cx="29" cy="77" r="5.4" fill="url(#chrome)"/>
  <circle cx="84" cy="72" r="5.4" fill="url(#chrome)"/>
</svg>
